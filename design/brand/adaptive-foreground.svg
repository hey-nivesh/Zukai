<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 432" width="432" height="432">
  <defs>
    <linearGradient id="af-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A4F924" />
      <stop offset="45%" stop-color="#92F702" />
      <stop offset="100%" stop-color="#0BF807" />
    </linearGradient>

    <linearGradient id="af-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="af-armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A3845" />
      <stop offset="60%" stop-color="#0D1E24" />
      <stop offset="100%" stop-color="#061014" />
    </linearGradient>

    <filter id="af-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Centered Safe Zone 264x264dp (bounds: x:84 to 348, y:84 to 348) -->
  <g id="foreground-mark" transform="translate(68, 68) scale(0.295)">
    <!-- Back Angular Z Body -->
    <path d="M 120 780 L 720 780 L 920 620 L 780 620 L 520 720 L 260 720 Z" fill="#09161B" />
    
    <!-- Giant Diagonal 'Z' Stripe in Neon Volt -->
    <path d="M 280 200 L 460 200 L 860 680 L 680 680 Z" fill="url(#af-green-grad)" filter="url(#af-glow)" opacity="0.95" />
    <!-- Secondary Parallel Accent Line -->
    <polygon points="460,200 520,200 860,610 800,610" fill="#09161B" />
    <polygon points="530,200 580,200 900,590 850,590" fill="url(#af-green-grad)" />

    <!-- Helmet Shell -->
    <path d="M 240 180 L 580 180 L 680 340 L 620 520 L 520 580 L 340 580 L 260 480 L 300 320 Z" fill="url(#af-armor)" stroke="#18333D" stroke-width="8" />
    <path d="M 380 160 L 560 160 L 640 280 L 580 280 Z" fill="url(#af-green-grad)" />

    <!-- Clean Face Mask -->
    <polygon points="260,420 440,420 410,560 300,560 280,490" fill="#F8F9FA" />

    <!-- Visor Assembly -->
    <path d="M 220 360 L 540 340 L 510 460 L 230 475 Z" fill="#050D10" stroke="#18333D" stroke-width="8" />
    <path d="M 235 372 L 525 352 L 498 448 L 245 460 Z" fill="url(#af-green-grad)" filter="url(#af-glow)" />
    <!-- Visor Gloss Reflection -->
    <path d="M 242 376 L 518 358 L 510 405 Q 370 425 248 412 Z" fill="url(#af-gloss)" />

    <!-- Lower Triangle Audio Mark inside Z Crook -->
    <g transform="translate(620, 520)">
      <polygon points="90,10 170,150 10,150" fill="#050D10" stroke="#18333D" stroke-width="8" />
      <rect x="42" y="80" width="16" height="45" rx="8" fill="url(#af-green-grad)" />
      <rect x="82" y="45" width="16" height="80" rx="8" fill="url(#af-green-grad)" />
      <rect x="122" y="75" width="16" height="50" rx="8" fill="url(#af-green-grad)" />
    </g>
  </g>
</svg>
