<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 432" width="432" height="432">
  <defs>
    <radialGradient id="ab-grad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#112920" />
      <stop offset="50%" stop-color="#09161B" />
      <stop offset="100%" stop-color="#04090C" />
    </radialGradient>
    <filter id="ab-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Obsidian Base -->
  <rect width="432" height="432" fill="url(#ab-grad)" />

  <!-- Soft Radial Green Ambient Halo -->
  <circle cx="216" cy="210" r="130" fill="#92F702" opacity="0.14" filter="url(#ab-glow)" />
  <circle cx="216" cy="235" r="95" fill="#0BF807" opacity="0.12" filter="url(#ab-glow)" />

  <!-- Subtle High-tech 45-degree Grid Pattern -->
  <path d="M 0 108 L 432 108 M 0 216 L 432 216 M 0 324 L 432 324" stroke="rgba(255,255,255,0.02)" stroke-width="1" />
  <path d="M 108 0 L 108 432 M 216 0 L 216 432 M 324 0 L 324 432" stroke="rgba(255,255,255,0.02)" stroke-width="1" />
</svg>
