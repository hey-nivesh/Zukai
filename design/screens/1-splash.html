<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zukai — 1. Splash Screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="screen-common.css">
  <style>
    .splash-screen {
      background-color: var(--canvas-abyss);
      background-image: 
        radial-gradient(circle at 50% 46%, rgba(146, 247, 2, 0.22) 0%, transparent 55%),
        radial-gradient(circle at 50% 55%, rgba(11, 248, 7, 0.16) 0%, transparent 65%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    .splash-logo-container {
      width: 140px;
      height: 140px;
      margin-bottom: 24px;
      animation: logoPulse 2.8s ease-in-out infinite;
    }

    @keyframes logoPulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 16px rgba(146, 247, 2, 0.4));
      }
      50% {
        transform: scale(1.04);
        filter: drop-shadow(0 0 32px rgba(146, 247, 2, 0.8));
      }
    }

    .splash-title {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 6px;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .splash-tagline {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--brand-500);
      text-transform: uppercase;
    }

    .splash-loader {
      position: absolute;
      bottom: 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .pulsing-bar {
      width: 48px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .pulsing-bar::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 50%;
      background: var(--brand-500);
      animation: barSlide 1.2s infinite ease-in-out;
    }

    @keyframes barSlide {
      0% { left: -50%; width: 30%; }
      50% { left: 40%; width: 60%; }
      100% { left: 110%; width: 30%; }
    }
  </style>
</head>
<body>
  <div class="phone-viewport splash-screen">
    <div class="status-bar" style="position: absolute; top: 0; left: 0; right: 0;">
      <span>9:41</span>
      <div class="status-bar-icons">
        <svg width="16" height="12" viewBox="0 0 24 18" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z"/></svg>
        <svg width="24" height="12" viewBox="0 0 24 12" fill="currentColor"><rect x="1" y="1" width="19" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="3" width="13" height="6" rx="1.5"/></svg>
      </div>
    </div>

    <div class="splash-logo-container">
      <img src="../brand/adaptive-foreground.svg" alt="Zukai Logo" style="width: 100%; height: 100%;" />
    </div>

    <h1 class="splash-title">ZUKAI</h1>
    <p class="splash-tagline">Listen to understand</p>

    <div class="splash-loader">
      <div class="pulsing-bar"></div>
      <span style="font-size: 11px; color: var(--text-tertiary); letter-spacing: 0.5px;">INITIALIZING AUDIO ENGINE</span>
    </div>

    <div class="home-indicator"></div>
  </div>
</body>
</html>
