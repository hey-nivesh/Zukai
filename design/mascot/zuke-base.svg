<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="base-visor-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A4F924" />
      <stop offset="40%" stop-color="#92F702" />
      <stop offset="100%" stop-color="#0BF807" />
    </linearGradient>

    <linearGradient id="base-visor-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="base-armor-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18333D" />
      <stop offset="60%" stop-color="#0D1E24" />
      <stop offset="100%" stop-color="#09161B" />
    </linearGradient>

    <filter id="base-neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Character -->
  <g id="glow">
    <circle cx="120" cy="115" r="75" fill="#92F702" opacity="0.12" filter="url(#base-neon-glow)" />
    <circle cx="115" cy="100" r="45" fill="#0BF807" opacity="0.18" filter="url(#base-neon-glow)" />
  </g>

  <!-- Body / Torso -->
  <g id="body">
    <!-- Shoulder Armor -->
    <path d="M 68 185 L 95 155 L 145 155 L 172 185 L 155 215 L 85 215 Z" fill="url(#base-armor-grad)" stroke="#18333D" stroke-width="2" />
    <!-- Chest Plate -->
    <path d="M 90 162 L 150 162 L 140 198 L 100 198 Z" fill="#09161B" stroke="#92F702" stroke-opacity="0.3" stroke-width="1.5" />
    <!-- Neon Seam Accents -->
    <line x1="80" y1="175" x2="95" y2="165" stroke="#92F702" stroke-width="2.5" stroke-linecap="round" />
    <line x1="160" y1="175" x2="145" y2="165" stroke="#92F702" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Audio Mark Triangle Emblem on Chest -->
  <g id="audio-mark" transform="translate(104, 168)">
    <polygon points="16,4 29,26 3,26" fill="#050D10" stroke="#18333D" stroke-width="1.5" />
    <!-- 3 Equalizer Bars -->
    <rect x="8" y="15" width="2.8" height="7" rx="1.4" fill="#92F702" />
    <rect x="14.6" y="9" width="2.8" height="13" rx="1.4" fill="#92F702" />
    <rect x="21.2" y="14" width="2.8" height="8" rx="1.4" fill="#92F702" />
  </g>

  <!-- Head & Helmet Assembly -->
  <g id="helmet">
    <!-- Back & Crest of Helmet (Angular Z Shape) -->
    <path d="M 85 45 L 148 45 L 175 88 L 158 132 L 138 148 L 92 148 L 72 118 L 82 78 Z" fill="url(#base-armor-grad)" stroke="#1E3E4A" stroke-width="2" />
    <!-- Top Cyber Stripe / Fin -->
    <path d="M 112 40 L 145 40 L 165 72 L 150 72 Z" fill="#92F702" />
    <polygon points="135,48 148,48 158,64 145,64" fill="#09161B" />
  </g>

  <!-- Face Mask (Clean White Angular Plate) -->
  <g id="face-mask">
    <polygon points="76,104 118,104 112,142 86,142 78,124" fill="#F8F9FA" />
    <path d="M 86 142 L 102 152 L 122 144" fill="none" stroke="#D1D9E0" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Visor Assembly (Hero Feature) -->
  <g id="visor">
    <!-- Visor Outer Black Frame -->
    <path d="M 64 88 L 146 84 L 140 114 L 68 118 Z" fill="#050D10" stroke="#18333D" stroke-width="2" />
    <!-- Visor Glowing Neon Core -->
    <path d="M 68 91 L 142 87 L 136 111 L 72 114 Z" fill="url(#base-visor-grad)" filter="url(#base-neon-glow)" opacity="0.95" />
    <!-- Visor Upper Gloss Reflection -->
    <path d="M 70 92 L 140 88 L 138 100 Q 102 105 71 102 Z" fill="url(#base-visor-gloss)" />
  </g>

  <!-- Neck Collar & Chintube -->
  <g id="accents">
    <path d="M 88 148 L 100 158 L 126 158 L 136 148" fill="#09161B" stroke="#92F702" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>

