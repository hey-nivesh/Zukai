<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="off-visor-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B828F" />
      <stop offset="60%" stop-color="#3A4B54" />
      <stop offset="100%" stop-color="#1E2B30" />
    </linearGradient>
    <linearGradient id="off-armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18333D" />
      <stop offset="60%" stop-color="#0D1E24" />
      <stop offset="100%" stop-color="#09161B" />
    </linearGradient>
    <filter id="off-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Muted Ambient Standby Glow -->
  <g id="glow">
    <circle cx="120" cy="115" r="70" fill="#00B0FF" opacity="0.08" filter="url(#off-glow)" />
  </g>

  <!-- Body / Torso (Standby pose) -->
  <g id="body">
    <path d="M 68 185 L 95 155 L 145 155 L 172 185 L 155 215 L 85 215 Z" fill="url(#off-armor)" stroke="#18333D" stroke-width="2" />
    <!-- Chest Plate & Standby Emblem -->
    <path d="M 90 162 L 150 162 L 140 198 L 100 198 Z" fill="#09161B" stroke="#6B828F" stroke-opacity="0.4" stroke-width="1.5" />
    <polygon points="120,169 133,191 107,191" fill="#050D10" stroke="#3A4B54" stroke-width="1.5" />
    <circle cx="120" cy="180" r="3.5" fill="#6B828F" />
  </g>

  <!-- Head & Helmet with Cyber Antenna -->
  <g id="helmet">
    <!-- Antenna extending up -->
    <line x1="130" y1="42" x2="142" y2="15" stroke="#92F702" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="142" cy="14" r="5" fill="#09161B" stroke="#92F702" stroke-width="2" />
    <circle cx="142" cy="14" r="2" fill="#92F702" filter="url(#off-glow)" />

    <!-- Radio waves seeking signal -->
    <path d="M 148 8 A 12 12 0 0 1 154 20" fill="none" stroke="#92F702" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.7" />
    <path d="M 154 3 A 18 18 0 0 1 162 24" fill="none" stroke="#92F702" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 4" opacity="0.4" />

    <!-- Helmet Base Shell -->
    <path d="M 85 45 L 148 45 L 175 88 L 158 132 L 138 148 L 92 148 L 72 118 L 82 78 Z" fill="url(#off-armor)" stroke="#1E3E4A" stroke-width="2" />
    <path d="M 112 40 L 145 40 L 165 72 L 150 72 Z" fill="#3A4B54" />

    <!-- Clean Face Mask -->
    <polygon points="76,104 118,104 112,142 86,142 78,124" fill="#E2E8F0" />

    <!-- Standby Visor with Disconnected Wifi Slash -->
    <path d="M 64 88 L 146 84 L 140 114 L 68 118 Z" fill="#050D10" stroke="#18333D" stroke-width="2" />
    <path d="M 68 91 L 142 87 L 136 111 L 72 114 Z" fill="url(#off-visor-grad)" opacity="0.9" />

    <!-- Wifi Icon with Strikethrough inside Visor -->
    <g transform="translate(98, 93)">
      <circle cx="9" cy="15" r="1.8" fill="#F8F9FA" />
      <path d="M 4 11 A 7 7 0 0 1 14 11" fill="none" stroke="#F8F9FA" stroke-width="1.8" stroke-linecap="round" />
      <path d="M 0 7 A 13 13 0 0 1 18 7" fill="none" stroke="#F8F9FA" stroke-width="1.8" stroke-linecap="round" />
      <!-- Diagonal Slash -->
      <line x1="-1" y1="18" x2="19" y2="4" stroke="#FF3D71" stroke-width="2.2" stroke-linecap="round" />
    </g>
  </g>
</svg>
