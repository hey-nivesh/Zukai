<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="u-visor-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A4F924" />
      <stop offset="50%" stop-color="#92F702" />
      <stop offset="100%" stop-color="#0BF807" />
    </linearGradient>
    <linearGradient id="u-beam-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#92F702" stop-opacity="0.0" />
      <stop offset="50%" stop-color="#92F702" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0BF807" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="u-doc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)" />
      <stop offset="100%" stop-color="rgba(146,247,2,0.12)" />
    </linearGradient>
    <linearGradient id="u-armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18333D" />
      <stop offset="60%" stop-color="#0D1E24" />
      <stop offset="100%" stop-color="#09161B" />
    </linearGradient>
    <filter id="u-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <g id="glow">
    <circle cx="120" cy="115" r="75" fill="#92F702" opacity="0.12" filter="url(#u-glow)" />
    <ellipse cx="120" cy="50" rx="45" ry="20" fill="#0BF807" opacity="0.25" filter="url(#u-glow)" />
  </g>

  <!-- Holographic Upward Upload Beam -->
  <g id="upload-beam">
    <polygon points="90,160 150,160 165,40 75,40" fill="url(#u-beam-grad)" />
    <!-- Floating Upload Particle Dots -->
    <circle cx="115" cy="120" r="2.5" fill="#FFFFFF" opacity="0.9" />
    <circle cx="128" cy="95" r="3" fill="#92F702" opacity="0.8" />
    <circle cx="105" cy="70" r="2" fill="#FFFFFF" opacity="0.9" />
    <circle cx="122" cy="50" r="3.5" fill="#92F702" filter="url(#u-glow)" />
  </g>

  <!-- Floating Holographic Document -->
  <g id="floating-document" transform="translate(94, 25)">
    <!-- Glass Doc Card -->
    <rect x="0" y="0" width="52" height="66" rx="8" fill="url(#u-doc-grad)" stroke="#92F702" stroke-width="1.5" />
    <!-- Dog-ear corner -->
    <path d="M 38 0 L 52 14 L 38 14 Z" fill="#92F702" opacity="0.4" />
    <!-- Doc Text Lines (Equalizer styled) -->
    <rect x="8" y="18" width="24" height="3" rx="1.5" fill="#F8F9FA" opacity="0.9" />
    <rect x="8" y="26" width="36" height="3" rx="1.5" fill="#92F702" />
    <rect x="8" y="34" width="32" height="3" rx="1.5" fill="#F8F9FA" opacity="0.7" />
    <rect x="8" y="42" width="20" height="3" rx="1.5" fill="#92F702" opacity="0.8" />
    <!-- Center Upward Audio Arrow -->
    <circle cx="26" cy="53" r="7" fill="#09161B" stroke="#92F702" stroke-width="1.2" />
    <path d="M 26 49 L 22 54 L 25 54 L 25 57 L 27 57 L 27 54 L 30 54 Z" fill="#92F702" />
  </g>

  <!-- Body / Torso -->
  <g id="body">
    <path d="M 68 185 L 95 155 L 145 155 L 172 185 L 155 215 L 85 215 Z" fill="url(#u-armor)" stroke="#18333D" stroke-width="2" />
    <!-- Chest Plate & Emblem -->
    <path d="M 90 162 L 150 162 L 140 198 L 100 198 Z" fill="#09161B" stroke="#92F702" stroke-opacity="0.3" stroke-width="1.5" />
    <polygon points="120,169 133,191 107,191" fill="#050D10" stroke="#18333D" stroke-width="1.5" />
    <rect x="112" y="180" width="2.5" height="7" rx="1.2" fill="#92F702" />
    <rect x="118.8" y="174" width="2.5" height="13" rx="1.2" fill="#92F702" />
    <rect x="125.5" y="179" width="2.5" height="8" rx="1.2" fill="#92F702" />
  </g>

  <!-- Head & Helmet (Looking Upward at Document) -->
  <g id="helmet">
    <path d="M 85 52 L 148 52 L 175 95 L 158 138 L 138 154 L 92 154 L 72 124 L 82 85 Z" fill="url(#u-armor)" stroke="#1E3E4A" stroke-width="2" />
    <path d="M 112 47 L 145 47 L 165 79 L 150 79 Z" fill="#92F702" />
  </g>

  <!-- Clean Face Mask -->
  <g id="face-mask">
    <polygon points="76,110 118,110 112,148 86,148 78,130" fill="#F8F9FA" />
  </g>

  <!-- Visor Assembly (Tilted Up with Upward HUD Arrow) -->
  <g id="visor">
    <path d="M 64 94 L 146 90 L 140 120 L 68 124 Z" fill="#050D10" stroke="#18333D" stroke-width="2" />
    <path d="M 68 97 L 142 93 L 136 117 L 72 120 Z" fill="url(#u-visor-grad)" filter="url(#u-glow)" opacity="0.95" />
    <!-- Visor HUD Arrow symbol -->
    <path d="M 105 112 L 105 104 L 101 107 L 105 100 L 109 107 L 105 104" fill="#FFFFFF" />
  </g>

  <!-- Cyber Hands Channeling Beam -->
  <g id="hands">
    <circle cx="78" cy="155" r="10" fill="#0D1E24" stroke="#92F702" stroke-width="2" />
    <circle cx="78" cy="155" r="4" fill="#92F702" />
    <circle cx="162" cy="155" r="10" fill="#0D1E24" stroke="#92F702" stroke-width="2" />
    <circle cx="162" cy="155" r="4" fill="#92F702" />
  </g>
</svg>
