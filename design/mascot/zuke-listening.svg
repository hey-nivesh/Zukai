<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="l-visor-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A4F924" />
      <stop offset="50%" stop-color="#92F702" />
      <stop offset="100%" stop-color="#0BF807" />
    </linearGradient>
    <linearGradient id="l-armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18333D" />
      <stop offset="60%" stop-color="#0D1E24" />
      <stop offset="100%" stop-color="#09161B" />
    </linearGradient>
    <filter id="l-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Sound Waves Radiating -->
  <g id="sound-waves">
    <!-- Left Radiating Arcs -->
    <path d="M 42 78 A 38 38 0 0 0 42 128" fill="none" stroke="#92F702" stroke-width="2.5" stroke-linecap="round" opacity="0.8" filter="url(#l-glow)" />
    <path d="M 30 68 A 54 54 0 0 0 30 138" fill="none" stroke="#0BF807" stroke-width="2" stroke-linecap="round" opacity="0.5" filter="url(#l-glow)" />
    <path d="M 18 58 A 70 70 0 0 0 18 148" fill="none" stroke="#92F702" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />

    <!-- Right Radiating Arcs -->
    <path d="M 198 78 A 38 38 0 0 1 198 128" fill="none" stroke="#92F702" stroke-width="2.5" stroke-linecap="round" opacity="0.8" filter="url(#l-glow)" />
    <path d="M 210 68 A 54 54 0 0 1 210 138" fill="none" stroke="#0BF807" stroke-width="2" stroke-linecap="round" opacity="0.5" filter="url(#l-glow)" />
    <path d="M 222 58 A 70 70 0 0 1 222 148" fill="none" stroke="#92F702" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />
  </g>

  <!-- Body / Torso -->
  <g id="body">
    <path d="M 68 185 L 95 155 L 145 155 L 172 185 L 155 215 L 85 215 Z" fill="url(#l-armor)" stroke="#18333D" stroke-width="2" />
    <!-- Chest Plate & Emblem -->
    <path d="M 90 162 L 150 162 L 140 198 L 100 198 Z" fill="#09161B" stroke="#92F702" stroke-opacity="0.3" stroke-width="1.5" />
    <polygon points="120,169 133,191 107,191" fill="#050D10" stroke="#18333D" stroke-width="1.5" />
    <rect x="112" y="180" width="2.5" height="7" rx="1.2" fill="#92F702" />
    <rect x="118.8" y="174" width="2.5" height="13" rx="1.2" fill="#92F702" />
    <rect x="125.5" y="179" width="2.5" height="8" rx="1.2" fill="#92F702" />
  </g>

  <!-- Head & Helmet Assembly -->
  <g id="helmet">
    <path d="M 85 45 L 148 45 L 175 88 L 158 132 L 138 148 L 92 148 L 72 118 L 82 78 Z" fill="url(#l-armor)" stroke="#1E3E4A" stroke-width="2" />
    <path d="M 112 40 L 145 40 L 165 72 L 150 72 Z" fill="#92F702" />
  </g>

  <!-- Clean Face Mask -->
  <g id="face-mask">
    <polygon points="76,104 118,104 112,142 86,142 78,124" fill="#F8F9FA" />
  </g>

  <!-- Visor (Relaxed, Closed Eyes Curve in Acoustic Bliss) -->
  <g id="visor">
    <path d="M 64 88 L 146 84 L 140 114 L 68 118 Z" fill="#050D10" stroke="#18333D" stroke-width="2" />
    <path d="M 68 91 L 142 87 L 136 111 L 72 114 Z" fill="url(#l-visor-grad)" filter="url(#l-glow)" opacity="0.95" />
    <!-- Serene Eyelid / Musical Note Waveform -->
    <path d="M 76 102 Q 88 108 100 102" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <path d="M 110 101 Q 122 107 134 101" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Sleek Glowing Cyber Headphones -->
  <g id="headphones">
    <!-- Headphone Arch Band over Helmet -->
    <path d="M 52 102 C 50 32, 190 32, 188 102" fill="none" stroke="#050D10" stroke-width="12" stroke-linecap="round" />
    <path d="M 52 102 C 50 32, 190 32, 188 102" fill="none" stroke="#92F702" stroke-width="3" stroke-linecap="round" />

    <!-- Left Ear Cup -->
    <rect x="42" y="80" width="18" height="42" rx="9" fill="#09161B" stroke="#92F702" stroke-width="2.5" />
    <circle cx="51" cy="101" r="5" fill="#92F702" filter="url(#l-glow)" />

    <!-- Right Ear Cup -->
    <rect x="180" y="80" width="18" height="42" rx="9" fill="#09161B" stroke="#92F702" stroke-width="2.5" />
    <circle cx="189" cy="101" r="5" fill="#92F702" filter="url(#l-glow)" />
  </g>
</svg>
