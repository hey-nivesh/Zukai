<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="t-visor-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A4F924" />
      <stop offset="50%" stop-color="#92F702" />
      <stop offset="100%" stop-color="#0BF807" />
    </linearGradient>
    <linearGradient id="t-armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18333D" />
      <stop offset="60%" stop-color="#0D1E24" />
      <stop offset="100%" stop-color="#09161B" />
    </linearGradient>
    <filter id="t-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Processing Aura -->
  <g id="glow">
    <circle cx="120" cy="110" r="85" fill="#92F702" opacity="0.14" filter="url(#t-glow)" />
    <circle cx="120" cy="110" r="55" fill="#0BF807" opacity="0.22" filter="url(#t-glow)" />
  </g>

  <!-- Orbiting Holographic Data Rings -->
  <g id="orbit-rings">
    <!-- Tilted Elliptical Ring 1 -->
    <ellipse cx="120" cy="115" rx="98" ry="34" fill="none" stroke="#92F702" stroke-width="1.8" stroke-dasharray="8 6 18 6" opacity="0.65" transform="rotate(-18 120 115)" />
    <!-- Tilted Elliptical Ring 2 -->
    <ellipse cx="120" cy="115" rx="88" ry="30" fill="none" stroke="#00B0FF" stroke-width="1.5" stroke-dasharray="4 6 12 4" opacity="0.55" transform="rotate(24 120 115)" />
    <!-- Orbiting Data Nodes -->
    <circle cx="34" cy="95" r="4" fill="#92F702" filter="url(#t-glow)" />
    <circle cx="204" cy="132" r="3.5" fill="#0BF807" filter="url(#t-glow)" />
    <circle cx="168" cy="72" r="3" fill="#00B0FF" filter="url(#t-glow)" />
    <circle cx="68" cy="148" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Floating Body / Meditating Torso in Micro-gravity -->
  <g id="body">
    <path d="M 72 175 L 95 148 L 145 148 L 168 175 L 150 205 L 90 205 Z" fill="url(#t-armor)" stroke="#18333D" stroke-width="2" />
    <!-- Floating Legs folded -->
    <path d="M 85 205 L 70 216 L 105 224 L 120 205" fill="none" stroke="#132830" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 155 205 L 170 216 L 135 224 L 120 205" fill="none" stroke="#132830" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Chest Plate & Emblem -->
    <path d="M 92 154 L 148 154 L 140 188 L 100 188 Z" fill="#09161B" stroke="#92F702" stroke-opacity="0.3" stroke-width="1.5" />
    <polygon points="120,160 133,182 107,182" fill="#050D10" stroke="#18333D" stroke-width="1.5" />
    <rect x="112" y="171" width="2.5" height="7" rx="1.2" fill="#92F702" />
    <rect x="118.8" y="165" width="2.5" height="13" rx="1.2" fill="#92F702" />
    <rect x="125.5" y="170" width="2.5" height="8" rx="1.2" fill="#92F702" />
  </g>

  <!-- Head & Helmet Assembly -->
  <g id="helmet">
    <path d="M 85 45 L 148 45 L 175 88 L 158 132 L 138 148 L 92 148 L 72 118 L 82 78 Z" fill="url(#t-armor)" stroke="#1E3E4A" stroke-width="2" />
    <path d="M 112 40 L 145 40 L 165 72 L 150 72 Z" fill="#92F702" />
    <polygon points="135,48 148,48 158,64 145,64" fill="#09161B" />
  </g>

  <!-- Clean Face Mask -->
  <g id="face-mask">
    <polygon points="76,104 118,104 112,142 86,142 78,124" fill="#F8F9FA" />
  </g>

  <!-- Visor with Animated Equalizer & Calculating Waveform -->
  <g id="visor">
    <path d="M 64 88 L 146 84 L 140 114 L 68 118 Z" fill="#050D10" stroke="#18333D" stroke-width="2" />
    <path d="M 68 91 L 142 87 L 136 111 L 72 114 Z" fill="url(#t-visor-grad)" filter="url(#t-glow)" opacity="0.95" />
    <!-- Visor Calculating Matrix / Equalizer Bars -->
    <g transform="translate(76, 92)">
      <rect x="4" y="8" width="3" height="10" rx="1" fill="#FFFFFF" />
      <rect x="11" y="4" width="3" height="14" rx="1" fill="#FFFFFF" />
      <rect x="18" y="10" width="3" height="8" rx="1" fill="#FFFFFF" />
      <rect x="25" y="2" width="3" height="16" rx="1" fill="#FFFFFF" />
      <rect x="32" y="7" width="3" height="11" rx="1" fill="#FFFFFF" />
      <rect x="39" y="11" width="3" height="7" rx="1" fill="#FFFFFF" />
      <rect x="46" y="5" width="3" height="13" rx="1" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Floating Cyber Hands in Concentration -->
  <g id="hands">
    <circle cx="56" cy="170" r="8" fill="#0D1E24" stroke="#92F702" stroke-width="2" />
    <circle cx="56" cy="170" r="3.5" fill="#92F702" />
    <circle cx="184" cy="170" r="8" fill="#0D1E24" stroke="#92F702" stroke-width="2" />
    <circle cx="184" cy="170" r="3.5" fill="#92F702" />
  </g>
</svg>
