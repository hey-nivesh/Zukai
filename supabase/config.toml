  # ==============================================================================
# Supabase CLI Project Configuration
# ==============================================================================

project_id = "zukai"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "zukai://auth/callback"
additional_redirect_urls = [
  "zukai://auth/callback",
  "zukai://auth/reset-password",
  "http://localhost:8081",
  "http://localhost:8081/--/auth/callback"
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[auth.external.google]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""
